[pytest]
testpaths = tests
addopts = -ra
markers =
    integration: needs a Postgres reachable at 127.0.0.1:15432 (tick-chain replay); auto-skips if unreachable.
                 The unit CI job runs `-m "not integration"` (fast, no infra); the integration job runs `-m integration`
                 with a port-forward to the cluster DB.
