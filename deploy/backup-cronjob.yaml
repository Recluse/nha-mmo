# SECOND, in-cluster world backup — REDUNDANCY, not a gap-filler.
#
# CORRECTION (2026-09-03): this job was originally added on the claim that the world had NO scheduled backup.
# THAT CLAIM WAS WRONG. It came from searching only the cluster (no CronJobs) and this repo (only the CI
# pre-deploy dump) — but the real backup runs as a HOST-LEVEL job on the monitoring VM, outside both, and had
# been working all along: /home/recluse/backups/db/postgres-nha-<ts>.sql.gz, daily at ~04:1x UTC, each with a
# .sha256 companion, 12 generations retained. That off-cluster copy with checksums is STRICTLY BETTER than this
# one. Lesson recorded on purpose: "I could not find it" is not "it does not exist".
#
# Why this job is still worth keeping (the operator may equally choose to delete it):
#   - it is an INDEPENDENT mechanism, so it still produces a copy if the VM job silently stops;
#   - it lands on k8s-w2, a different failure domain from both w1 (which holds the live hostPath) and the VM;
#   - it gives a fast in-cluster restore path that needs no egress.
# Cost is ~200MB on w2 (14 generations x ~15MB).
#
# pg_dump comes from postgres:16-alpine, matching the server's 16.13 exactly — a NEWER pg_dump can emit archives
# an older server cannot restore, and an older one refuses to dump a newer server outright.
#
# NOT restore-verified: a restore probe into a throwaway DB tripled live spectator latency (/world 0.75s -> 4.2s)
# by competing with the world for Postgres I/O, so it was aborted. A restore drill belongs on a separate instance
# or in a quiet window.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nha-world-backup
  namespace: nha-mmo
spec:
  schedule: "17 3 * * *"                # 03:17 daily — off the hour, so it never lines up with other cron traffic
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid             # a slow dump must never overlap itself
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600         # if the cluster was down at 03:17, still run when it comes back
  jobTemplate:
    spec:
      backoffLimit: 2
      # 3600 was not a safety margin, it was a tripwire: the dump crept 43min -> 56min -> over the hour, and on
      # 2026-09-10 the job was killed by this deadline having produced nothing. With -Fc -Z1 and a real CPU share
      # it should finish in minutes; the generous ceiling is there so a slow night degrades into a slow backup
      # rather than into no backup.
      activeDeadlineSeconds: 10800
      template:
        spec:
          restartPolicy: Never
          # ndots:1 is MANDATORY here, same as every other manifest in this directory. Without it the default
          # ndots:5 search-suffixes a 4-dot FQDN before trying it literally, and the lookup escaped the cluster
          # and resolved to the PUBLIC gateway IP — pg_dump then got "connection refused" from the wrong host.
          dnsConfig: {options: [{name: ndots, value: "1"}]}
          nodeName: k8s-w2.recluse.ru   # NOT w1 — the whole point is to land the copy on different hardware
          securityContext:
            runAsUser: 0                # writes into a root-owned hostPath on the node
          containers:
            - name: dump
              image: postgres:16-alpine
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  # WEEKLY FULL, DAILY STATE. Measured 2026-09-10 while this job ran: it spent 17+ minutes inside
                  # a single `COPY public.events TO stdout`, waiting on ClientWrite — every other table together
                  # took seconds. `events` is 8.8M rows / 2.6GB of the 2.9GB database, kept in full ON PURPOSE for
                  # replay, and growing ~0.5GB/month, so a nightly full dump only gets slower forever.
                  # A restore needs WORLD STATE (entities, world, market_orders, contracts, messages...); the
                  # event log is history. So the daily copy excludes the event ROWS (the table and its schema are
                  # still in the archive, so a restore yields a working world with an empty log), and Sunday takes
                  # the full one. The off-site VM job remains a full daily copy regardless — see the header.
                  if [ "$(date -u +%u)" = "7" ]; then KIND=full; EXCL=""; else KIND=state; EXCL="--exclude-table-data=events"; fi
                  OUT="/backups/world-$(date -u +%Y%m%d-%H%M%S)-$KIND.dump"
                  echo "dumping nhamoo ($KIND) -> $OUT"
                  # -Fc -Z1, not `| gzip`. The old form ran 43min, then 56min, then blew the 1h deadline outright
                  # on 2026-09-10 and produced NO backup at all. It was never the database's fault: `events` is
                  # 2.6GB of the 2.9GB (8.8M rows of full history, ~0.5GB/month by design), and the pod compressed
                  # all of it through gzip at the default level on a 100m CPU share. pg_dump's own format at
                  # level 1 compresses far cheaper, streams straight to a file, and — unlike a flat .sql.gz —
                  # restores selectively, so a single table can be pulled back without replaying the whole world.
                  # RESTORE IS NOW `pg_restore`, not `gunzip | psql`:
                  #   pg_restore -h <host> -U nhamoo -d nhamoo --clean --if-exists world-<ts>.dump
                  #   pg_restore -t entities -a ...            # one table, data only
                  pg_dump -h postgres.nha-mmo.svc.cluster.local -U nhamoo -d nhamoo $EXCL -Fc -Z1 -f "$OUT"
                  # VERIFY before pruning: a truncated or corrupt dump must never evict a good one. Reading the
                  # archive's table of contents is the -Fc equivalent of `gzip -t` and is strictly stronger — it
                  # proves the footer was written, which is exactly what a killed dump lacks. The size floor
                  # still catches the "died early but wrote a valid-looking header" case.
                  pg_restore -l "$OUT" > /dev/null
                  SZ=$(stat -c%s "$OUT")
                  [ "$SZ" -gt 1048576 ] || { echo "ABORT: $OUT is only ${SZ}B — refusing to prune with a suspect dump"; exit 1; }
                  echo "ok: ${SZ} bytes, archive TOC readable"
                  # Sweep STUB files before pruning. A failed dump (bad DNS, server restart) leaves a tiny header
                  # behind; those would then occupy retention slots and silently push real backups out. Observed
                  # for real on this job's first run. Anything under 1MiB cannot be a world dump. Both patterns
                  # are swept and retained together so the older .sql.gz generations age out normally.
                  find /backups -name 'world-*.dump' -size -1024k -delete
                  find /backups -name 'world-*.sql.gz' -size -1024k -delete
                  # Retained SEPARATELY, or the 6 state dumps between two Sundays would evict every full one
                  # inside a fortnight and the weekly history copy would quietly cease to exist.
                  ls -t /backups/world-*-state.dump 2>/dev/null | tail -n +15 | xargs -r rm -f   # 14 daily
                  ls -t /backups/world-*-full.dump  2>/dev/null | tail -n +6  | xargs -r rm -f   # 5 weekly
                  ls -t /backups/world-*.sql.gz     2>/dev/null | tail -n +4  | xargs -r rm -f   # legacy, ageing out
                  # Un-suffixed .dump files predate the state/full split (a manual verification run made one).
                  # They match neither retention glob, so without this they would live forever.
                  find /backups -maxdepth 1 -name 'world-*.dump' ! -name '*-state.dump' ! -name '*-full.dump' -mtime +14 -delete
                  echo "retained: $(ls -1 /backups/world-*state.dump 2>/dev/null | wc -l) state, $(ls -1 /backups/world-*full.dump 2>/dev/null | wc -l) full, $(ls -1 /backups/world-*.sql.gz 2>/dev/null | wc -l) legacy"
              env:
                - {name: PGCONNECT_TIMEOUT, value: "10"}
              volumeMounts:
                - {name: backups, mountPath: /backups}
              resources:
                # 100m was the real bottleneck: under node contention the dump got a tenth of a core to compress
                # 2.9GB through, which is how a backup starts taking the better part of an hour.
                requests: {cpu: 500m, memory: 256Mi}
                limits: {memory: 1Gi}
          volumes:
            - name: backups
              hostPath:
                path: /var/lib/nha-backups
                type: DirectoryOrCreate
