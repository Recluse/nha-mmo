# nha-tick = the single engine ticker. EXACTLY ONE replica — two would double-tick the world and corrupt
# the deterministic state-hash chain. RUN_TICK=1 makes server.app._startup run the engine tick loop here
# (the nha-mmo-server API workers do NOT, see server.yaml). It is NOT selected by the Service (app=nha-tick),
# so it gets zero API traffic and the whole core goes to the 2s world tick — no GIL fight with /observe.
# Same code (engine + server ConfigMaps). strategy:Recreate = never two tickers overlapping on a rollout.
# NB single process: NO --workers (uvicorn --workers N would run _startup N times → N tickers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nha-tick
  namespace: nha-mmo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: nha-tick}}
  template:
    metadata: {labels: {app: nha-tick}}
    spec:
      nodeSelector: {ci-build: "true"}
      dnsConfig: {options: [{name: ndots, value: "1"}]}
      containers:
        - name: tick
          image: python:3.12-slim
          workingDir: /app
          command: ["sh", "-c"]
          args:
            # dedicated tick process — NOT uvicorn. Skips _grid (the /map biome pre-warm the ticker never needs,
            # which stalled startup under load) and serves no HTTP. Just ensure-world then the engine tick loop.
            - pip install --no-cache-dir -q fastapi "uvicorn[standard]" psycopg2-binary pydantic
              && exec python -c "from server import app; app._ensure_world(); app._tick_loop()"
          env:
            - {name: PG_DSN, value: "host=postgres.nha-mmo.svc.cluster.local dbname=nhamoo user=nhamoo"}  # DIRECT
            - {name: TICK_SECONDS, value: "2"}
            - {name: WORLD_SEED, value: "42"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: RUN_TICK, value: "1"}    # <-- only this pod runs the engine
          # no ports / no httpGet probe — dedicated tick process serves no HTTP (a /healthz probe would pin it 0/1).
          # The tick loop self-heals transient DB errors; a hard crash exits PID 1 → k8s restarts the pod.
          volumeMounts:
            - {name: engine, mountPath: /app/engine}
            - {name: server, mountPath: /app/server}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {memory: 768Mi}
      volumes:
        - {name: engine, configMap: {name: nha-engine-code}}
        - {name: server, configMap: {name: nha-server-code}}
