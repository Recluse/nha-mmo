apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nha-mmo
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nha-mmo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeSelector: {ci-build: "true"}   # w1/w2
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: nhamoo}
            - {name: POSTGRES_USER, value: nhamoo}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}   # in-cluster only, ClusterIP-private
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "nhamoo"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        # Ephemeral: this cluster has no dynamic storage provisioner (only local-no-provisioner).
        # The world is deterministically seeded (worldgen) and re-seeds on restart. For persistence,
        # pre-create a static local PV and swap this for a PersistentVolumeClaim.
        - name: data
          emptyDir: {}
