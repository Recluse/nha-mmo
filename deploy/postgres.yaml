apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nha-mmo
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: nha-mmo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeName: k8s-w1.recluse.ru        # PIN to one node — its hostPath below holds the DB
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: nhamoo}
            - {name: POSTGRES_USER, value: nhamoo}
            - {name: POSTGRES_HOST_AUTH_METHOD, value: trust}   # in-cluster only, ClusterIP-private
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "nhamoo"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        # Persistent host-path on k8s-w1 (this cluster has no dynamic-storage provisioner). The pod is
        # pinned to k8s-w1 via nodeName, so this directory always holds the DB and survives pod restarts.
        # The postgres image's entrypoint runs as root and chowns PGDATA, so no initContainer is needed.
        - name: data
          hostPath:
            path: /var/lib/nha-postgres
            type: DirectoryOrCreate
