apiVersion: v1
kind: Service
metadata:
  name: nha-mmo
  namespace: nha-mmo
spec:
  type: NodePort
  selector: {app: nha-mmo-server}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30091}
---
# nha-mmo-server = the API tier: N uvicorn workers, NO RUN_TICK env (does not run the engine).
# The single engine ticker lives in the nha-tick deployment (server-tick.yaml). The Service selects
# THIS deployment's pods (app=nha-mmo-server). Split done so the heavy 2s tick stops blocking /observe (GIL).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nha-mmo-server
  namespace: nha-mmo
spec:
  replicas: 1
  selector: {matchLabels: {app: nha-mmo-server}}
  template:
    metadata: {labels: {app: nha-mmo-server}}
    spec:
      nodeSelector: {ci-build: "true"}
      dnsConfig: {options: [{name: ndots, value: "1"}]}   # resolve pypi.org/external names directly
      containers:
        - name: server
          # Code is mounted from the nha-engine-code / nha-server-code ConfigMaps (generated from the
          # repo at deploy time) — no registry/pull-secret needed on this private homelab cluster.
          # (A baked image is also available via the repo Dockerfile if you prefer.)
          image: python:3.12-slim
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir -q fastapi "uvicorn[standard]" psycopg2-binary pydantic
              && exec uvicorn server.app:app --host 0.0.0.0 --port 8000
          env:
            - {name: PG_DSN, value: "host=postgres.nha-mmo.svc.cluster.local dbname=nhamoo user=nhamoo"}
            - {name: TICK_SECONDS, value: "2"}
            - {name: WORLD_SEED, value: "42"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: RUN_TICK, value: "1"}    # single-process for now (ticks AND serves). The api+tick split is
                                              # parked until the app uses a CONNECTION POOL — per-request _connect
                                              # x4 workers exhausted Postgres max_connections (FATAL: too many clients).
          ports: [{containerPort: 8000}]
          startupProbe:                       # generous: pip install + Postgres coming up + world seed
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          volumeMounts:
            - {name: engine, mountPath: /app/engine}
            - {name: server, mountPath: /app/server}
          resources:
            requests: {cpu: 250m, memory: 320Mi}    # 4 uvicorn workers
            limits: {memory: 1Gi}
      volumes:
        - {name: engine, configMap: {name: nha-engine-code}}
        - {name: server, configMap: {name: nha-server-code}}
