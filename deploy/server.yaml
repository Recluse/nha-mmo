apiVersion: v1
kind: Service
metadata:
  name: nha-mmo
  namespace: nha-mmo
spec:
  type: NodePort
  selector: {app: nha-mmo-server}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30091}
---
# nha-mmo-server = the API tier: uvicorn, NO RUN_TICK env (does not run the engine).
# The single engine ticker lives in the nha-tick deployment (server-tick.yaml). The Service selects
# THIS deployment's pods (app=nha-mmo-server). Split so the heavy 2s tick stops blocking /observe (GIL).
# HA (2026-06-13): 2 replicas spread across nodes + multi-worker + liveness + zero-downtime rollout + PDB.
# Root cause of the 2026-06-13 TLS-probe outage: the single replica went NotReady on a /healthz timeout
# (a leaked 7.5h idle-in-txn blocked autovacuum -> bloat -> slow queries -> stall) -> Service had no backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nha-mmo-server
  namespace: nha-mmo
spec:
  replicas: 2                                # baked image + nginx edge-cache mean origin load is ~flat vs spectators; 2 is plenty (was briefly 6 during the 01.09 spike)
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 0}   # terminate-then-create: frees a node so the replacement spreads (hard topology). Site still served by the other replica.
  selector: {matchLabels: {app: nha-mmo-server}}
  template:
    metadata: {labels: {app: nha-mmo-server}}
    spec:
      nodeSelector: {ci-build: "true"}       # w1+w2 carry this label; cp1 stays clear
      topologySpreadConstraints:             # HARD-spread the 2 replicas one-per-node -> survive 1 node loss.
        - maxSkew: 1                          # (if a node is down, the 2nd replica waits Pending until it returns;
          topologyKey: kubernetes.io/hostname #  the surviving replica keeps the site up — acceptable trade-off)
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: nha-mmo-server}}
      dnsConfig: {options: [{name: ndots, value: "1"}]}   # resolve pypi.org/external names directly
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - {name: nha-gitlab-registry}      # read_registry deploy token → pull the deps image from registry.gitlab.com
      containers:
        - name: server
          # App CODE is still mounted from the nha-engine-code / nha-server-code ConfigMaps (regenerated from the
          # repo at deploy time). The DEPS are now baked into this image (Dockerfile → GitLab registry) so pods start
          # INSTANTLY — no more pip-on-boot (which made rollouts ~90s/pod and dropped capacity mid-deploy, the pain
          # point of the 01.09 spectator-spike incident). Rebuild the image only when deps change (CI build-image job).
          image: registry.gitlab.com/recluse-internal/no-human-allowed-mmo/server:deps-fec3d138f968
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["sh", "-c"]
          args:
            - exec uvicorn server.app:app --host 0.0.0.0 --port 8000 --workers 2
          env:
            - {name: PG_DSN, value: "host=postgres.nha-mmo.svc.cluster.local dbname=nhamoo user=nhamoo"}  # DIRECT (pgbouncer parked)
            - {name: TICK_SECONDS, value: "2"}
            - {name: WORLD_SEED, value: "42"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            # Auth for /guild/verdict and /announce. The secret stays `optional` ON PURPOSE: the app now FAILS
            # CLOSED (503 on just those two endpoints) when it is absent, so a missing secret degrades the guild
            # rather than refusing to start every pod — the site stays up and the failure is loud in the log.
            # Provision the SAME value on the off-cluster referee (agents/guild.py):
            #   kubectl -n nha-mmo create secret generic nha-guild --from-literal=token="$(openssl rand -hex 32)"
            - name: GUILD_TOKEN
              valueFrom: {secretKeyRef: {name: nha-guild, key: token, optional: true}}
            # no RUN_TICK -> API-only. Tick offloaded to nha-tick. Safe: _ensure_world skips DDL when `world` exists.
          ports: [{containerPort: 8000}]
          startupProbe:                       # generous: Postgres coming up + world seed (deps are baked, no pip)
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 40
            timeoutSeconds: 8
          readinessProbe:                     # /healthz can queue behind CPU-heavy /observe under load —
            httpGet: {path: /healthz, port: 8000}   # tolerate slow replies; with 2 replicas a slow pod is just removed, no 502
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          livenessProbe:                      # restart only a TRULY hung pod (~2.5 min unresponsive); very generous
            httpGet: {path: /healthz, port: 8000}   # so a merely-busy pod is never killed — readiness handles transient slowness
            periodSeconds: 15
            timeoutSeconds: 8
            failureThreshold: 10
          volumeMounts:
            - {name: engine, mountPath: /app/engine}
            - {name: server, mountPath: /app/server}
          resources:
            requests: {cpu: 300m, memory: 384Mi}    # 2 uvicorn workers
            limits: {memory: 1536Mi}                 # 1Gi ловил OOMKilled под нагрузкой (18 и 21 авг); no CPU limit on purpose (avoid throttling /observe under burst)
      volumes:
        - {name: engine, configMap: {name: nha-engine-code}}
        # server code (text) + static assets (binary) are TWO ConfigMaps, each under its own 1 MiB cap,
        # flat-merged into /app/server by a projected volume (keys don't collide). Split 2026-08-29 after
        # the single nha-server-code cm crossed 1 MiB and a mid-deploy replace left it deleted.
        - name: server
          projected:
            sources:
              - configMap: {name: nha-server-code}
              - configMap: {name: nha-server-static}
---
# Keep >=1 API pod up during voluntary disruptions (node drain, rollout). Valid only with replicas>=2
# (a PDB on a single replica would block node/cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nha-mmo-server-pdb
  namespace: nha-mmo
spec:
  minAvailable: 1
  selector: {matchLabels: {app: nha-mmo-server}}
