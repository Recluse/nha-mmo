apiVersion: v1
kind: Service
metadata:
  name: nha-mmo
  namespace: nha-mmo
spec:
  type: NodePort
  selector: {app: nha-mmo-server}
  ports:
    - {port: 8000, targetPort: 8000, nodePort: 30090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nha-mmo-server
  namespace: nha-mmo
spec:
  replicas: 1
  selector: {matchLabels: {app: nha-mmo-server}}
  template:
    metadata: {labels: {app: nha-mmo-server}}
    spec:
      nodeSelector: {ci-build: "true"}
      imagePullSecrets: [{name: gitlab-registry}]
      containers:
        - name: server
          image: registry.gitlab.com/recluse-internal/no-human-allowed-mmo:latest
          env:
            - {name: PG_DSN, value: "host=postgres.nha-mmo.svc.cluster.local dbname=nhamoo user=nhamoo"}
            - {name: TICK_SECONDS, value: "2"}
            - {name: WORLD_SEED, value: "42"}
          ports: [{containerPort: 8000}]
          startupProbe:                       # generous grace while Postgres comes up + world seeds
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
