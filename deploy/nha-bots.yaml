# Scripted local-style NHA bots, moved into the cluster (no LLM, pure urllib stdlib). One pod runs all four:
# тупой (random), барыга (depot trader), дровосек (lumberjack), шахтёр (miner). Code lives in the nha-bots-code
# configmap (built from agents/{runner,dumb,baryga,woodcutter,miner}.py). Talks to the server in-cluster at nha-mmo:8000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nha-bots
  namespace: nha-mmo
spec:
  replicas: 1
  selector:
    matchLabels: {app: nha-bots}
  template:
    metadata:
      labels: {app: nha-bots}
    spec:
      dnsConfig:                 # cluster gotcha: pods need ndots:1 or DNS lookups stall
        options:
        - name: ndots
          value: "1"
      containers:
      - name: bots
        image: python:3.12-slim
        env:
        - name: SERVER_URL
          value: "http://nha-mmo:8000"
        - name: NHA_TOKENS               # persisted bot secrets (seeded from the DB) so each bot reclaims its
          value: "/tokens/tokens.json"   # agent across restarts — the server no longer hands out a token by name
        envFrom:
        - secretRef:
            name: nha-groq        # GROQ_API_KEY + GROQ_URL for varvar_groq (the scripted bots ignore them)
        command: ["sh", "-c"]
        args:
        # absolute paths so every backgrounded bot finds its file regardless of cwd (each bot adds /app to sys.path itself)
        # A SECOND miner (Prospector) runs the same proven Expansion pipeline → two barons co-fund the Phobos Forward
        # Base (a colony needs >=2 distinct funders to complete). Distinct MINER_NAME → its own agent + token.
        - "python /app/dumb.py & python /app/baryga.py & python /app/woodcutter.py & python /app/miner.py & MINER_NAME=Prospector MINER_DEST=phobos python /app/miner.py & python /app/varvar_groq.py & wait"
        volumeMounts:
        - name: code
          mountPath: /app
        - name: tokens
          mountPath: /tokens
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: nha-bots-code
      - name: tokens
        secret:
          secretName: nha-bot-tokens
          optional: true       # tolerate absence on a fresh cluster; bots then mint fresh tokens for new agents
